name: ci
on: [push]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: node --check server.js
      - run: |
          PORT=3000 node server.js & sleep 2
          curl -fsS http://127.0.0.1:3000/ | grep -F "fixture OK"
